fri:
  port: 30200
  robot_ip: 192.170.10.2
  robot_description: /$(arg robot_name)/robot_description

hardware_interface:
  control_freq: 200 # in Hz
  joints:
    - ${robot_name}_joint_1
    - ${robot_name}_joint_2
    - ${robot_name}_joint_3
    - ${robot_name}_joint_4
    - ${robot_name}_joint_5
    - ${robot_name}_joint_6
    - ${robot_name}_joint_7

publish:
  additional_info: true
  commanded_torques: true
